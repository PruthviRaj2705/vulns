# INTENTIONALLY INSECURE - SAST test only
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: vuln-lab }
  template:
    metadata:
      labels: { app: vuln-lab }
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: web
          image: vuln-lab:latest
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
          env:
            - name: DB_PASSWORD
              value: admin123
          volumeMounts:
            - { name: host, mountPath: /host }
      volumes:
        - name: host
          hostPath: { path: / }
